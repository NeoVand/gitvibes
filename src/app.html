<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<meta
			name="description"
			content="Git for Vibe Coders — an interactive, visual tutorial that teaches Git to AI-assisted developers. Learn branching, staging, undoing mistakes, and VS Code workflows."
		/>
		<meta property="og:title" content="GitVibes — Git for Vibe Coders" />
		<meta
			property="og:description"
			content="An interactive, visual Git tutorial for AI-assisted developers. Learn branching, staging, undoing mistakes, and VS Code workflows."
		/>
		<meta property="og:image" content="%sveltekit.assets%/og-image.png" />
		<meta
			property="og:image:alt"
			content="Git for Vibe Coders — your safety net for AI-assisted coding"
		/>
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="GitVibes — Git for Vibe Coders" />
		<meta
			name="twitter:description"
			content="An interactive, visual Git tutorial for AI-assisted developers."
		/>
		<meta name="twitter:image" content="%sveltekit.assets%/og-image.png" />
		<meta
			name="twitter:image:alt"
			content="Git for Vibe Coders — your safety net for AI-assisted coding"
		/>
		<script>
			// Apply the stored theme before first paint to avoid a flash of the
			// wrong theme. Mirrors $lib/theme.ts applyTheme.
			try {
				const theme = localStorage.getItem('gitvibes-theme');
				if (theme === 'light' || theme === 'dark') {
					document.documentElement.classList.add(theme);
				}
			} catch {
				/* storage unavailable — system theme applies */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
